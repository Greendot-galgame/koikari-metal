name: Bug report / 缺陷报告
description: 提交可复现的运行、存档、渲染或构建问题。
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 README 与已知限制。不要附带 XP3、原始素材、完整台词、存档或令牌。
        安全漏洞请使用仓库 Security 页的私密报告入口。
  - type: input
    id: revision
    attributes:
      label: 提交或版本
      placeholder: git rev-parse --short HEAD 的结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: macOS 版本、CPU 架构、Rust 版本；图形问题另附窗口尺寸和缩放比例。
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: 资源模式
      options:
        - 基础资源（--base-only）
        - 含追加归档
        - 无资源 / 合成测试 / 构建阶段
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 提供最小步骤、命令或合成输入；可记录脚本标识、行号、指令名，不要贴完整剧情。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostic
    attributes:
      label: 已脱敏的诊断信息
      description: 仅贴与问题直接相关的错误片段。请删除个人路径、秘密和剧情正文。
      render: text
  - type: checkboxes
    id: rights
    attributes:
      label: 提交检查
      options:
        - label: 我没有附带原始游戏资源、完整剧情、用户存档或访问令牌。
          required: true
        - label: 我已说明哪些测试实际执行，未把无资源早退当成完整集成验收。
          required: true
