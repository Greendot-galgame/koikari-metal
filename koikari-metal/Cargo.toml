[package]
name = "koikari-metal"
version = "0.1.0"
edition = "2024"
description = "A Steam-free macOS visual novel runtime for locally owned Koikari XP3 assets"
build = "build.rs"

[dependencies]
anyhow = "1.0"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
metal = "0.32"
objc = "0.2.7"
raw-window-handle = "0.6"
core-graphics-types = "0.2"
rodio = { version = "0.21", default-features = false, features = ["playback", "vorbis", "wav"] }
ogg = "0.9"
opus = "0.3"

[build-dependencies]
cc = "1.2"

[profile.release]
lto = "thin"
strip = "debuginfo"
